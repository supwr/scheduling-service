spring:
  datasource:
    url: jdbc:h2:mem:scheduling-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    topics:
      notification: scheduling.appointment.notification
      history: scheduling.appointment.history
